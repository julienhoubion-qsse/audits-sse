<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISO 9001 — Parties prenantes</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--green:#6BBF1F;--green-dk:#4D8A12;--green-lt:#D6F0A8;--green-xlt:#EEF8D8;--steel:#4A6880;--steel-dk:#2E4558;--steel-lt:#C8D8E4;--steel-xlt:#EAF1F6;--charcoal:#3A3A3A;--white:#FFFFFF;--slate:#F2F6F9;--muted:#6B7D8A;--border:#D0DDE8;--indigo:#4F46E5;--indigo-lt:#EEF2FF;--amber:#D97706;--amber-lt:#FEF3C7;--red:#DC2626;--red-lt:#FEE2E2;--radius:10px;--shadow:0 2px 14px rgba(46,69,88,.10)}
body{font-family:'Nunito Sans',sans-serif;background:var(--slate);color:var(--charcoal);margin:0}
.page-header{background:linear-gradient(135deg,var(--steel-dk),var(--steel));padding:18px 28px;position:relative;overflow:hidden}
.page-header::after{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--green)}
.ph-tag{font-family:'Exo 2',sans-serif;font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#a5b4fc;margin-bottom:4px}
.ph-title{font-family:'Exo 2',sans-serif;font-size:18px;font-weight:800;color:#fff}
.nav-bar{background:var(--steel-dk);padding:0 28px;display:flex;overflow-x:auto}
.nav-btn{background:none;border:none;border-bottom:3px solid transparent;padding:11px 16px;font-family:'Nunito Sans',sans-serif;font-size:12px;font-weight:600;color:var(--steel-lt);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block;transition:all .15s}
.nav-btn:hover{color:#fff}
.nav-btn.active{color:#fff!important;border-bottom-color:var(--green)!important}
.wrapper{max-width:1300px;margin:0 auto;padding:20px 24px 60px}
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.card-hd{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.card-title{font-family:'Exo 2',sans-serif;font-size:13px;font-weight:700;color:var(--steel-dk);flex:1}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;background:var(--slate);border-bottom:1px solid var(--border)}
.fld-sel,.fld-inp{height:32px;border:1px solid var(--border);border-radius:7px;padding:0 10px;font-family:'Nunito Sans',sans-serif;font-size:12px;background:var(--white)}
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table thead th{background:var(--steel-dk);color:#fff;padding:9px 12px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.data-table tbody tr{border-bottom:1px solid var(--border)}
.data-table tbody tr:hover{background:var(--slate)}
.data-table tbody td{padding:9px 12px;vertical-align:top}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:12px;white-space:nowrap}
.badge-r4{background:#FEE2E2;color:#DC2626}
.badge-r3{background:#FEF3C7;color:#D97706}
.badge-r2{background:#EEF2FF;color:#4F46E5}
.badge-r1{background:var(--green-xlt);color:var(--green-dk)}
.badge-na{background:var(--slate);color:var(--muted)}
</style>
</head>
<body>
<div class="page-header">
  <div class="ph-tag">ISO 9001 — Parties prenantes</div>
  <div class="ph-title">👥 Cartographie des parties prenantes — Tous processus</div>
</div>
<div class="nav-bar">
  <a class="nav-btn" href="Accueil_SSE.html">🏠 Site SSE</a>
  <a class="nav-btn" href="ISO9001_Cartographie.html">🗺️ Accueil ISO 9001</a>
  <a class="nav-btn active" href="ISO9001_Parties_Prenantes.html">👥 Parties prenantes</a>
  <a class="nav-btn" href="ISO9001_Risques_Opportunites.html">⚡ Risques &amp; Opps</a>
  <a class="nav-btn" href="ISO9001_KPI_Dashboard.html">📊 KPI Dashboard</a>
  <a class="nav-btn" href="ISO9001_Plan_Actions.html">📋 Plan d'actions</a>
</div>
<div class="wrapper">
  <div class="card">
    <div class="filter-bar">
      <select class="fld-sel" id="f-processus" onchange="render()"><option value="">Tous les processus</option></select>
      <select class="fld-sel" id="f-niveau" onchange="render()">
        <option value="">Tous niveaux</option>
        <option value="R4">R4 — Très haut</option>
        <option value="R3">R3 — Haut</option>
        <option value="R2">R2 — Secondaire</option>
        <option value="R1">R1 — Mineur</option>
      </select>
      <input class="fld-inp" id="f-search" placeholder="Rechercher..." oninput="render()" style="min-width:200px">
      <span id="count-label" style="font-size:12px;color:var(--muted);align-self:center"></span>
    </div>
    <div style="overflow-x:auto">
      <table class="data-table">
        <thead><tr><th>Processus</th><th>Partie prenante</th><th style="width:60px;text-align:center">F</th><th style="width:60px;text-align:center">I</th><th style="width:80px;text-align:center">Score</th><th style="width:130px;text-align:center">Niveau</th><th>Besoins et attentes</th></tr></thead>
        <tbody id="pp-tbody"></tbody>
      </table>
    </div>
  </div>
</div>
<script src="iso9001_data.js"></script>
<script>

function niveauBadge(n) {
    if (!n) return '<span class="badge badge-na">—</span>';
    const map = {
        'R4': '<span class="badge badge-r4">R4 — Très haut</span>',
        'R3': '<span class="badge badge-r3">R3 — Haut</span>',
        'R2': '<span class="badge badge-r2">R2 — Secondaire</span>',
        'R1': '<span class="badge badge-r1">R1 — Mineur</span>',
    };
    return map[n] || '<span class="badge badge-na">'+n+'</span>';
}
function noteBadge(note) {
    if (!note) return '<span class="badge badge-na">—</span>';
    const n = parseInt(note);
    if (n >= 12) return '<span class="badge badge-r4">'+n+' — Critique</span>';
    if (n >= 8)  return '<span class="badge badge-r3">'+n+' — Élevé</span>';
    if (n >= 4)  return '<span class="badge badge-r2">'+n+' — Modéré</span>';
    return '<span class="badge badge-r1">'+n+' — Faible</span>';
}

// Build filter options
const procSel = document.getElementById('f-processus');
Object.keys(PROCESSUS_DATA).forEach(code => {
    const opt = document.createElement('option');
    opt.value = code; opt.textContent = PROCESS_ICONS[code] + ' ' + code + ' — ' + PROCESS_NAMES[code];
    procSel.appendChild(opt);
});

function render() {
    const fp = document.getElementById('f-processus').value;
    const fn = document.getElementById('f-niveau').value;
    const fs = document.getElementById('f-search').value.toLowerCase();
    let rows = [];
    Object.entries(PROCESSUS_DATA).forEach(([code, p]) => {
        if (fp && fp !== code) return;
        p.parties_prenantes.forEach(pp => {
            if (fn && pp.niveau !== fn) return;
            if (fs && !(pp.nom.toLowerCase().includes(fs) || (pp.besoins||'').toLowerCase().includes(fs))) return;
            rows.push({code, pp});
        });
    });
    rows.sort((a,b) => {
        const order = {R4:0,R3:1,R2:2,R1:3,'':4};
        return (order[a.pp.niveau]||4)-(order[b.pp.niveau]||4);
    });
    document.getElementById('count-label').textContent = rows.length + ' entrée(s)';
    const tbody = document.getElementById('pp-tbody');
    if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--muted)">Aucun résultat</td></tr>';
        return;
    }
    tbody.innerHTML = rows.map(({code,pp}) => `
        <tr>
            <td><a href="ISO9001_Processus.html?p=${code}" style="color:var(--indigo);font-weight:700;text-decoration:none">${PROCESS_ICONS[code]} ${code}</a></td>
            <td style="font-weight:600">${pp.nom}</td>
            <td style="text-align:center">${pp.F||'—'}</td>
            <td style="text-align:center">${pp.I||'—'}</td>
            <td style="text-align:center;font-weight:700">${pp.score||'—'}</td>
            <td style="text-align:center">${niveauBadge(pp.niveau)}</td>
            <td style="font-size:11px;max-width:400px">${pp.besoins||'—'}</td>
        </tr>`).join('');
}
render();
</script></body></html>
