var scores = {};

const GRADES = [
  {min:90,label:'A',color:'#059669',text:'Excellent'},
  {min:75,label:'B',color:'#4F46E5',text:'Bien'},
  {min:58,label:'C',color:'#D97706',text:'Satisfaisant'},
  {min:34,label:'D',color:'#DC2626',text:'Non satisfaisant'},
  {min:0, label:'E',color:'#7F1D1D',text:'Totalement inacceptable'}
];

function getGrade(pct) {
  for (var i=0;i<GRADES.length;i++) { if(pct>=GRADES[i].min) return GRADES[i]; }
  return GRADES[GRADES.length-1];
}

function updateScore() {
  var total=0, maxScore=0, naCount=0, zeroCount=0, goodCount=0;
  MR_DATA.forEach(function(mr) {
    mr.krs.forEach(function(kr) {
      var s = scores[kr.ref];
      if (!s || s.na) { naCount++; return; }
      maxScore += 3;
      var v = s.val !== null && s.val !== undefined ? parseInt(s.val) : 0;
      total += v;
      if (v===0) zeroCount++;
      if (v>=2) goodCount++;
    });
  });
  var pct = maxScore>0 ? Math.round(total/maxScore*100) : 0;
  var grade = getGrade(pct);
  document.getElementById('score-val').textContent = total;
  document.getElementById('score-val').style.color = grade.color;
  document.getElementById('score-max').textContent = maxScore;
  document.getElementById('score-pct').textContent = pct+'%';
  document.getElementById('score-gauge').style.width = pct+'%';
  document.getElementById('score-gauge').style.background = grade.color;
  document.getElementById('grade-badge').textContent = grade.label;
  document.getElementById('grade-badge').style.background = grade.color;
  document.getElementById('info-nc').textContent = zeroCount+' KR cotes 0';
  document.getElementById('info-na').textContent = naCount+' N/A';
  document.getElementById('info-ok').textContent = goodCount+' KR cotes >= 2';

  MR_DATA.forEach(function(mr) {
    var mrT=0,mrM=0;
    mr.krs.forEach(function(kr){
      var s=scores[kr.ref];
      if(!s||s.na)return;
      mrM+=3; mrT+=(s.val!==null&&s.val!==undefined?parseInt(s.val):0);
    });
    var el=document.getElementById('mr-score-'+mr.id);
    if(el){ el.textContent=mrT+'/'+mrM; var p=mrM>0?Math.round(mrT/mrM*100):0; el.style.color=p>=75?'#86efac':p>=34?'#fde68a':'#fca5a5'; }
  });
}

function setCot(krRef, val) {
  if (!scores[krRef]) scores[krRef]={val:null,na:false,comment:''};
  scores[krRef].val = val; scores[krRef].na = false;
  var safeRef = krRef.replace(/\./g,'-');
  var block = document.getElementById('kr-block-'+safeRef);
  if (block) {
    block.querySelectorAll('.cot-btn:not([data-na])').forEach(function(b){
      b.className='cot-btn';
      if(parseInt(b.dataset.val)===val) b.classList.add('sel-'+val);
    });
  }
  updateScore();
}

function setNA(krRef, btn) {
  if (!scores[krRef]) scores[krRef]={val:null,na:false,comment:''};
  scores[krRef].na = !scores[krRef].na; scores[krRef].val = null;
  btn.classList.toggle('sel-na', scores[krRef].na);
  if (scores[krRef].na) {
    var safeRef = krRef.replace(/\./g,'-');
    var block = document.getElementById('kr-block-'+safeRef);
    if (block) block.querySelectorAll('.cot-btn:not([data-na])').forEach(function(b){b.className='cot-btn';});
  }
  updateScore();
}

function setComment(krRef, val) {
  if (!scores[krRef]) scores[krRef]={val:null,na:false,comment:''};
  scores[krRef].comment = val;
}

function buildGrid() {
  var html = '';
  MR_DATA.forEach(function(mr) {
    html += '<div class="mr-block">';
    html += '<div class="mr-hd" onclick="toggleMR(\'mr-body-'+mr.id+'\')">';
    html += '<span class="mr-hd-num">'+mr.id+'</span>';
    html += '<span class="mr-hd-text">'+mr.label+'</span>';
    html += '<span style="font-size:13px;font-weight:800" id="mr-score-'+mr.id+'">0/'+mr.krs.length*3+'</span>';
    html += '<span style="font-size:12px;opacity:.7">▼</span>';
    html += '</div>';
    html += '<div class="mr-body" id="mr-body-'+mr.id+'">';

    mr.krs.forEach(function(kr) {
      var safeRef = kr.ref.replace(/\./g,'-');
      html += '<div class="kr-block" id="kr-block-'+safeRef+'">';
      html += '<div class="kr-header">';
      html += '<span class="kr-ref">'+kr.ref+'</span>';
      html += '<div><div class="kr-name">'+kr.name+'</div>';
      if (kr.intitule && kr.intitule !== kr.name) {
        html += '<div class="kr-intitule">'+kr.intitule.substring(0,180)+'</div>';
      }
      html += '</div></div>';

      // Questions
      if (kr.questions && kr.questions.length) {
        html += '<div style="background:var(--slate);border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:11px;color:var(--muted)">';
        kr.questions.slice(0,3).forEach(function(q){
          html += '<div style="margin-bottom:2px">• '+q.substring(0,100)+'</div>';
        });
        if (kr.questions.length>3) html += '<div style="color:var(--indigo)">+ '+(kr.questions.length-3)+' autres questions...</div>';
        html += '</div>';
      }

      // Cotation
      html += '<div class="cotation-row">';
      html += '<span class="cot-label">Cotation</span>';
      for (var v=0;v<=3;v++) {
        var labels = ['0 — Non conforme','1 — Partiel','2 — Conforme partiel','3 — Conforme total'];
        html += '<button class="cot-btn" data-val="'+v+'" title="'+labels[v]+'" onclick="setCot(\''+kr.ref+'\','+v+')">'+v+'</button>';
      }
      html += '<button class="cot-btn" data-na="1" onclick="setNA(\''+kr.ref+'\',this)">N/A</button>';
      html += '<input class="comment-inp" placeholder="Commentaire / Preuve..." oninput="setComment(\''+kr.ref+'\',this.value)">';
      html += '</div>';
      html += '</div>';
    });
    html += '</div></div>';
  });
  document.getElementById('mr-grid').innerHTML = html;
  updateScore();
}

function toggleMR(bodyId) {
  var el = document.getElementById(bodyId);
  if (el) el.style.display = el.style.display==='none' ? '' : 'none';
}

function changeSite(site) { currentSite=site; history.replaceState(null,'','?site='+site); }

async function saveAudit() {
  var auditData = {
    id:'MRENV-'+currentSite+'-'+document.getElementById('inp-date').value,
    site:currentSite, referentiel:'MR_ENV',
    date:document.getElementById('inp-date').value,
    auditeurs:document.getElementById('inp-auditeurs').value.trim(),
    scores:scores, createdAt:new Date().toISOString()
  };
  try {
    await fetch(GSHEET_URL, {method:'POST', body:JSON.stringify({action:'saveAuditExigences', data:auditData})});
    showToast('Audit enregistre', true);
  } catch(e) { showToast('Erreur', false); }
}

function loadAudit() {
  window._audit_env_cb = function(d) {
    var data = d.data || [];
    var siteAudits = data.filter(function(r){return String(r[1])===currentSite && r[2]==='MR_ENV';});
    if (!siteAudits.length) { showToast('Aucun audit precedent', false); return; }
    var last = siteAudits[siteAudits.length-1];
    try {
      scores = JSON.parse(last[4]||'{}');
      document.getElementById('inp-date').value = last[3]||'';
      document.getElementById('inp-auditeurs').value = last[5]||'';
      buildGrid();
      Object.keys(scores).forEach(function(ref) {
        var s = scores[ref];
        if (s.na) { var b=document.querySelector('[data-kr="'+ref+'"][data-na]'); if(b)b.classList.add('sel-na'); }
        else if (s.val!==null) setCot(ref, s.val);
      });
      showToast('Audit charge', true);
    } catch(e) { showToast('Erreur chargement', false); }
  };
  var s = document.createElement('script');
  s.src = GSHEET_URL+'?action=getAuditExigences&callback=_audit_env_cb';
  document.head.appendChild(s);
}

function exportResults() {
  var lines=['MR Environnement Renault — Site '+currentSite+' — '+document.getElementById('inp-date').value,''];
  var total=0,maxScore=0;
  MR_DATA.forEach(function(mr){
    lines.push('=== '+mr.id+': '+mr.label+' ===');
    mr.krs.forEach(function(kr){
      var s=scores[kr.ref];
      var val=s?(s.na?'N/A':s.val!==null?s.val:'—'):'—';
      lines.push('  '+kr.ref+' — '+kr.name+': '+val+(s&&s.comment?' ['+s.comment+']':''));
      if(s&&!s.na&&s.val!==null){maxScore+=3;total+=parseInt(s.val||0);}
    });
    lines.push('');
  });
  var pct=maxScore>0?Math.round(total/maxScore*100):0;
  lines.push('SCORE: '+total+'/'+maxScore+' ('+pct+'%) — Grade: '+getGrade(pct).label);
  var blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='MR_Env_Site'+currentSite+'_'+document.getElementById('inp-date').value+'.txt';
  a.click();
}

function showToast(msg,ok){
  var t=document.getElementById('toast');
  t.textContent=msg; t.style.background=ok?'var(--green-dk)':'var(--steel-dk)';
  t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},3000);
}

buildGrid();
</script>
