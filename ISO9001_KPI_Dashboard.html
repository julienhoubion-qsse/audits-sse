<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISO 9001 — Tableau de bord KPI</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--green:#6BBF1F;--green-dk:#4D8A12;--green-lt:#D6F0A8;--green-xlt:#EEF8D8;--steel:#4A6880;--steel-dk:#2E4558;--steel-lt:#C8D8E4;--steel-xlt:#EAF1F6;--charcoal:#3A3A3A;--white:#FFFFFF;--slate:#F2F6F9;--muted:#6B7D8A;--border:#D0DDE8;--indigo:#4F46E5;--indigo-lt:#EEF2FF;--amber:#D97706;--amber-lt:#FEF3C7;--red:#DC2626;--red-lt:#FEE2E2;--radius:10px;--shadow:0 2px 14px rgba(46,69,88,.10)}
body{font-family:'Nunito Sans',sans-serif;background:var(--slate);color:var(--charcoal);margin:0}
.page-header{background:linear-gradient(135deg,var(--steel-dk),var(--steel));padding:18px 28px;position:relative;overflow:hidden}
.page-header::after{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--green)}
.ph-tag{font-family:'Exo 2',sans-serif;font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#a5b4fc;margin-bottom:4px}
.ph-title{font-family:'Exo 2',sans-serif;font-size:18px;font-weight:800;color:#fff}
.nav-bar{background:var(--steel-dk);padding:0 28px;display:flex;overflow-x:auto}
.nav-btn{background:none;border:none;border-bottom:3px solid transparent;padding:11px 16px;font-family:'Nunito Sans',sans-serif;font-size:12px;font-weight:600;color:var(--steel-lt);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block;transition:all .15s}
.nav-btn:hover{color:#fff}
.nav-btn.active{color:#fff!important;border-bottom-color:var(--green)!important}
.wrapper{max-width:1300px;margin:0 auto;padding:20px 24px 60px}
.process-section{margin-bottom:20px}
.proc-hd{background:var(--steel-dk);color:#fff;padding:12px 18px;border-radius:var(--radius) var(--radius) 0 0;display:flex;align-items:center;gap:10px}
.proc-hd-icon{font-size:18px}
.proc-hd-name{font-family:'Exo 2',sans-serif;font-size:14px;font-weight:700;flex:1}
.proc-hd-link{font-size:12px;color:var(--green-lt);text-decoration:none}
.proc-body{background:var(--white);border-radius:0 0 var(--radius) var(--radius);box-shadow:var(--shadow)}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1px;background:var(--border)}
.kpi-cell{background:var(--white);padding:14px 16px}
.kpi-lib{font-size:12px;font-weight:600;color:var(--charcoal);margin-bottom:6px}
.kpi-obj{font-size:11px;color:var(--muted)}
.kpi-freq{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--indigo-lt);color:var(--indigo);margin-top:4px}
.kpi-val-zone{margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.kpi-val-inp{height:30px;width:100%;border:1px solid var(--border);border-radius:6px;padding:0 8px;font-size:12px;font-family:'Nunito Sans',sans-serif}
.no-kpi{padding:16px 18px;color:var(--muted);font-style:italic;font-size:12px}
.add-kpi-btn{background:none;border:1px dashed var(--border);border-radius:6px;padding:8px 12px;color:var(--muted);font-size:12px;cursor:pointer;width:100%;text-align:center;transition:all .15s}
.add-kpi-btn:hover{border-color:var(--indigo);color:var(--indigo)}
.summary-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 20px;margin-bottom:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.sum-item{text-align:center}
.sum-val{font-family:'Exo 2',sans-serif;font-size:26px;font-weight:800}
.sum-lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
</style>
</head>
<body>
<div class="page-header">
  <div class="ph-tag">ISO 9001 — Tableau de bord KPI</div>
  <div class="ph-title">📊 Indicateurs de performance — Tous processus</div>
</div>
<div class="nav-bar">
  <a class="nav-btn" href="Accueil_SSE.html">🏠 Site SSE</a>
  <a class="nav-btn" href="ISO9001_Cartographie.html">🗺️ Accueil ISO 9001</a>
  <a class="nav-btn" href="ISO9001_Parties_Prenantes.html">👥 Parties prenantes</a>
  <a class="nav-btn" href="ISO9001_Risques_Opportunites.html">⚡ Risques &amp; Opps</a>
  <a class="nav-btn active" href="ISO9001_KPI_Dashboard.html">📊 KPI Dashboard</a>
  <a class="nav-btn" href="ISO9001_Plan_Actions.html">📋 Plan d'actions</a>
</div>
<div class="wrapper">
  <div class="summary-card" id="summary"></div>
  <div id="kpi-sections"></div>
</div>
<script src="iso9001_data.js"></script>
<script>

const totalKPI = Object.values(PROCESSUS_DATA).reduce((s,p) => s+p.indicateurs.length, 0);
const procWithKPI = Object.values(PROCESSUS_DATA).filter(p => p.indicateurs.length > 0).length;
document.getElementById('summary').innerHTML = `
    <div class="sum-item"><div class="sum-val" style="color:var(--indigo)">${Object.keys(PROCESSUS_DATA).length}</div><div class="sum-lbl">Processus</div></div>
    <div class="sum-item"><div class="sum-val" style="color:var(--green-dk)">${totalKPI}</div><div class="sum-lbl">KPI total</div></div>
    <div class="sum-item"><div class="sum-val" style="color:var(--amber)">${procWithKPI}</div><div class="sum-lbl">Processus avec KPI</div></div>
    <div class="sum-item"><div class="sum-val" style="color:var(--steel-dk)">${Object.keys(PROCESSUS_DATA).length-procWithKPI}</div><div class="sum-lbl">KPI à définir</div></div>
`;

const PROC_COLORS = {DIR:'#4F46E5',AMP:'#D97706',DECO:'#DC2626',GD:'#0891B2',ING:'#7C3AED',RES:'#059669',RH:'#DB2777',SI:'#D97706',SOU:'#2E4558',VEN:'#6BBF1F'};

let html = '';
Object.entries(PROCESSUS_DATA).forEach(([code, p]) => {
    const color = PROC_COLORS[code] || '#4A6880';
    html += `<div class="process-section">
        <div class="proc-hd" style="background:${color}">
            <span class="proc-hd-icon">${PROCESS_ICONS[code]}</span>
            <span class="proc-hd-name">${p.nom}</span>
            <a class="proc-hd-link" href="ISO9001_Processus.html?p=${code}&tab=kpi">Voir la fiche ›</a>
        </div>
        <div class="proc-body">`;

    if (!p.indicateurs.length) {
        html += `<div class="no-kpi">⚠️ Aucun indicateur défini pour ce processus — <a href="ISO9001_Processus.html?p=${code}" style="color:var(--indigo)">Ajouter des KPI</a></div>`;
    } else {
        html += '<div class="kpi-row">';
        p.indicateurs.forEach((ind,i) => {
            html += `<div class="kpi-cell">
                <div class="kpi-lib">${ind.libelle}</div>
                <div class="kpi-obj">Objectif : ${ind.objectif||'À définir'}</div>
                <span class="kpi-freq">${ind.frequence||'—'}</span>
                <div class="kpi-val-zone">
                    <input class="kpi-val-inp" placeholder="Valeur actuelle..." id="kval-${code}-${i}">
                </div>
            </div>`;
        });
        html += '</div>';
    }
    html += `<div style="padding:10px 14px"><button class="add-kpi-btn" onclick="location.href='ISO9001_Processus.html?p=${code}'">➕ Ajouter un KPI pour ce processus</button></div>`;
    html += '</div></div>';
});
document.getElementById('kpi-sections').innerHTML = html;
</script></body></html>
