function log(msg, cls) {
    const el = document.getElementById('log');
    const div = document.createElement('div');
    div.className = cls || 'info';
    div.textContent = msg;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
}

async function sendAction(action) {
    const resp = await fetch(GSHEET_URL, {
        method: 'POST',
        body: JSON.stringify({action: 'saveAction', data: action})
    });
    return resp.ok;
}

async function startSync() {
    const btn = document.getElementById('btn');
    btn.disabled = true;
    btn.textContent = '⏳ Synchronisation en cours...';
    log('Démarrage de la synchronisation — ' + ACTIONS.length + ' actions', 'info');
    
    let ok = 0, err = 0;
    for (let i = 0; i < ACTIONS.length; i++) {
        const a = ACTIONS[i];
        document.getElementById('progress').textContent = `Envoi ${i+1}/${ACTIONS.length} : ${a.description.substring(0,50)}...`;
        try {
            const success = await sendAction(a);
            if (success) {
                log(`✓ [${i+1}/${ACTIONS.length}] ${a.origin.substring(0,45)} — ${a.description.substring(0,40)}`, 'ok');
                ok++;
            } else {
                log(`✗ Erreur HTTP: ${a.description.substring(0,40)}`, 'err');
                err++;
            }
        } catch(e) {
            log(`✗ Erreur: ${e.message}`, 'err');
            err++;
        }
        // Small delay to avoid rate limiting
        await new Promise(r => setTimeout(r, 300));
    }
    
    document.getElementById('progress').textContent = `✅ Terminé — ${ok} envoyées, ${err} erreurs`;
    btn.textContent = ok === ACTIONS.length ? '✅ Synchronisation terminée !' : `⚠️ ${ok}/${ACTIONS.length} envoyées`;
    btn.style.background = ok === ACTIONS.length ? '#4D8A12' : '#D97706';
    log(`\n=== Résumé: ${ok} succès, ${err} erreurs ===`, ok === ACTIONS.length ? 'ok' : 'err');
}
