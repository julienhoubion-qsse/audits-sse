<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#6BBF1F;--green-dk:#4D8A12;--green-lt:#D6F0A8;--green-xlt:#EEF8D8;
  --steel:#4A6880;--steel-dk:#2E4558;--steel-mid:#7A96AA;--steel-lt:#C8D8E4;--steel-xlt:#EAF1F6;
  --charcoal:#3A3A3A;--white:#FFFFFF;--slate:#F2F6F9;--muted:#6B7D8A;--border:#D0DDE8;
  --ok-bg:#D6F0A8;--ok-tc:#2D5A00;--warn-bg:#FFF0B3;--warn-tc:#7A5000;
  --bad-bg:#FFD6D6;--bad-tc:#8B0000;--blue-bg:#DBEAFE;--blue-tc:#1e3a8a;
  --radius:10px;--shadow:0 2px 14px rgba(46,69,88,.10)
}
body{font-family:'Nunito Sans',sans-serif;background:var(--slate);color:var(--charcoal);min-height:100vh;margin:0}
.page-header{background:linear-gradient(135deg,var(--steel-dk),var(--steel));padding:20px 28px;display:flex;align-items:center;justify-content:space-between;position:relative;overflow:hidden}
.page-header::after{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--green)}
.ph-tag{font-family:'Exo 2',sans-serif;font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--green);margin-bottom:5px;position:relative;z-index:1}
.ph-title{font-family:'Exo 2',sans-serif;font-size:20px;font-weight:800;color:#fff;position:relative;z-index:1}
.ph-sub{font-size:12px;color:var(--steel-lt);margin-top:3px;position:relative;z-index:1}
.nav-bar{background:var(--steel-dk);padding:0 28px;display:flex;gap:0;overflow-x:auto}
.nav-btn{background:none;border:none;border-bottom:3px solid transparent;padding:12px 18px;font-family:'Nunito Sans',sans-serif;font-size:13px;font-weight:600;color:var(--steel-lt);cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s}
.nav-btn:hover{color:#fff;border-bottom-color:rgba(107,191,31,.5)}
.nav-btn.active{color:#fff!important;border-bottom-color:#6BBF1F!important}
.wrapper{max-width:1320px;margin:0 auto;padding:22px 24px 48px}
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.card-hd{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-title{font-family:'Exo 2',sans-serif;font-size:13px;font-weight:700;color:var(--steel-dk)}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;background:var(--slate);border-bottom:1px solid var(--border)}
.fld-sel,.fld-inp{height:34px;border:1px solid var(--border);border-radius:7px;padding:0 10px;font-family:'Nunito Sans',sans-serif;font-size:12px;background:var(--white);color:var(--charcoal)}
.btn{height:34px;padding:0 16px;border:none;border-radius:7px;font-family:'Nunito Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:var(--green);color:#fff}
.btn-ghost{background:var(--steel-xlt);color:var(--steel-dk);border:1px solid var(--border)}
.btn-danger{background:var(--bad-bg);color:var(--bad-tc);border:1px solid #fca5a5}
.btn-blue{background:var(--blue-bg);color:var(--blue-tc);border:1px solid #93c5fd}
.btn-sm{height:28px;padding:0 10px;font-size:11px}
.stats-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}

.action-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}
.action-badge{font-size:10px;padding:2px 8px;border-radius:12px;font-weight:600}
.badge-todo{background:#f1f5f9;color:#64748b}
.badge-inprogress{background:var(--warn-bg);color:var(--warn-tc)}
.badge-done{background:var(--ok-bg);color:var(--ok-tc)}

.action-progress{display:flex;align-items:center;gap:8px;min-width:100px}
.progress-bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}

.action-body{padding:12px 16px;border-top:1px solid var(--border);display:none}
.action-body.open{display:block}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
@media(max-width:600px){.form-row,.form-row-3{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:4px}
.fld-lbl{font-size:11px;font-weight:600;color:var(--steel-dk)}
.fld-txt{border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-family:'Nunito Sans',sans-serif;font-size:13px;resize:vertical;min-height:60px}
.fld-range{width:100%;accent-color:var(--green)}
.range-val{font-family:'Exo 2',sans-serif;font-size:16px;font-weight:700;color:var(--green-dk);text-align:center}
.efficace-row{display:flex;gap:10px;align-items:center;margin-bottom:10px;padding:10px;background:var(--green-xlt);border-radius:7px}
.radio-grp{display:flex;gap:8px}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--white);border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:600px;max-height:90vh;overflow-y:auto}
.modal-hd{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:'Exo 2',sans-serif;font-size:16px;font-weight:700;color:var(--steel-dk)}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--steel-dk);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;z-index:2000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-title{font-family:'Exo 2',sans-serif;font-size:16px;font-weight:700;color:var(--steel-dk);margin-bottom:6px}
</style>

<script>
const GSHEET_URL="https://script.google.com/macros/s/AKfycbxQenH3pxHDRm1pXvhoEQlWkQCV4lQJikI-ldcBS_wYuTTis2RCpYnIvpDS82b4wut4cg/exec";
let ACTIONS=[];

function jsonpGetActions(){
  return new Promise(function(resolve,reject){
    var cb='_cb'+Date.now();
    window[cb]=function(d){
      delete window[cb];
      var el=document.getElementById('_jsonp_actions');
      if(el)el.remove();
      var data=(d.data||[]).map(function(row){return{
        id:row[0],auditId:row[1],site:row[2],auditDate:row[3],
        sectionKey:row[4],criteriaIdx:Number(row[5]),origin:row[6],
        description:row[7],responsable:row[8],delai:row[9],
        avancement:Number(row[10]||0),commentaire:row[11],
        efficace:row[12]||'',createdAt:row[13]
      };});
      resolve(data);
    };
    var s=document.createElement('script');
    s.id='_jsonp_actions';
    s.src=GSHEET_URL+'?action=getActions&callback='+cb;
    s.onerror=function(){reject(new Error('JSONP failed'));};
    document.head.appendChild(s);
  });
}

async function apiSaveAction(action){
  await fetch(GSHEET_URL,{method:'POST',body:JSON.stringify({action:'saveAction',data:action})});
}
async function apiDeleteAction(id){
  await fetch(GSHEET_URL,{method:'POST',body:JSON.stringify({action:'deleteAction',id})});
}
async function apiUpdateAuditNC(auditId,sectionKey,criteriaIdx){
  await fetch(GSHEET_URL,{method:'POST',body:JSON.stringify({action:'checkAndUpdateNC',auditId,sectionKey,criteriaIdx})});
}

async function init(){
  try{
    ACTIONS=await jsonpGetActions();
  }catch(e){
    console.warn('Erreur chargement actions',e);
    ACTIONS=[];
  }
  var sites=[...new Set(ACTIONS.map(function(a){return a.site;}).filter(Boolean))].sort();
  var fSite=document.getElementById('f-site');
  sites.forEach(function(s){
    var o=document.createElement('option');
    o.value=s; o.textContent='Site '+s;
    fSite.appendChild(o);
  });
  render();
}

function getStatut(a){
  if(a.efficace==='oui')return 'efficace';
  if(a.avancement>=100)return 'done';
  if(a.avancement>0)return 'inprogress';
  return 'todo';
}
function statutLabel(st){
  if(st==='efficace')return'<span class="action-badge badge-efficace">✅ Efficace</span>';
  if(st==='done')return'<span class="action-badge badge-done">✔ Terminée</span>';
  if(st==='inprogress')return'<span class="action-badge badge-inprogress">⏳ En cours</span>';
  return'<span class="action-badge badge-todo">📌 À faire</span>';
}

function render(){
  var fSite=document.getElementById('f-site').value;
  var fStatut=document.getElementById('f-statut').value;
  var fOrigine=document.getElementById('f-origine').value.toLowerCase();
  var fSearch=document.getElementById('f-search').value.toLowerCase();
  var fResp=document.getElementById('f-responsable').value;

  // Populate responsable
  var respSel=document.getElementById('f-responsable');
  var cur=respSel.value;
  var allResp=[...new Set(ACTIONS.map(function(a){return a.responsable;}).filter(Boolean))].sort();
  respSel.innerHTML='<option value="">Tous responsables</option>'+allResp.map(function(r){return'<option value="'+r+'"'+(r===cur?' selected':'')+'>'+r+'</option>';}).join('');

  var lib=ACTIONS.filter(function(a){
    if(fSite&&a.site!==fSite)return false;
    if(fStatut&&getStatut(a)!==fStatut)return false;
    if(fResp&&a.responsable!==fResp)return false;
    if(fOrigine){
      var orig=(a.origin||'').toLowerCase();
      if(!orig.includes(fOrigine))return false;
    }
    if(fSearch){
      var hay=(a.description||'').toLowerCase()+(a.responsable||'').toLowerCase()+(a.origin||'').toLowerCase();
      if(!hay.includes(fSearch))return false;
    }
    return true;
  });

  document.getElementById('st-total').textContent=ACTIONS.length;
  document.getElementById('st-open').textContent=ACTIONS.filter(function(a){return getStatut(a)==='inprogress';}).length;
  document.getElementById('st-done').textContent=ACTIONS.filter(function(a){return['done','efficace'].includes(getStatut(a));}).length;
  document.getElementById('st-efficace').textContent=ACTIONS.filter(function(a){return a.efficace==='oui';}).length;

  var el=document.getElementById('action-list');
  if(!lib.length){
    el.innerHTML='<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-title">'+(ACTIONS.length===0?'Aucune action planifiée':'Aucun résultat')+'</div></div>';
    return;
  }

  var html = '';
  lib.forEach(function(a){
    var st=getStatut(a);
    var delaiStr=a.delai?new Date(a.delai).toLocaleDateString('fr-FR'):'—';
    var retard=a.delai&&a.avancement<100&&new Date(a.delai)<new Date()?'<span style="color:var(--bad-tc);font-size:10px;font-weight:700"> ⚠️ En retard</span>':'';
    var originLabel=a.origin||'—';
    var commentHtml=a.commentaire?'<div style="font-size:12px;margin-bottom:8px;padding:8px;background:var(--slate);border-radius:6px">💬 '+a.commentaire+'</div>':'';
    var efficaceHtml='';
    if(a.efficace==='oui')efficaceHtml='<div style="padding:6px 10px;background:var(--ok-bg);color:var(--ok-tc);border-radius:6px;font-size:12px;font-weight:600;margin-bottom:8px">✅ Action jugée efficace</div>';
    if(a.efficace==='non')efficaceHtml='<div style="padding:6px 10px;background:var(--bad-bg);color:var(--bad-tc);border-radius:6px;font-size:12px;font-weight:600;margin-bottom:8px">❌ Action jugée non efficace</div>';
    html += '<div class="action-card '+st+'" id="ac-'+a.id+'">';
    html += '<div class="action-hd" onclick="togAction(this)" data-id="'+a.id+'">';
    html += '<div style="flex:1">';
    html += '<div class="action-origin">'+originLabel+'</div>';
    html += '<div class="action-desc">'+(a.description||'—')+'</div>';
    html += '<div class="action-meta">'+statutLabel(st);
    html += '<span class="action-badge" style="background:var(--steel-xlt);color:var(--steel-dk)">👤 '+(a.responsable||'—')+'</span>';
    html += '<span class="action-badge" style="background:var(--steel-xlt);color:var(--steel-dk)">📅 '+delaiStr+retard+'</span>';
    html += '</div></div>';
    html += '<div class="action-progress"><div class="progress-bar"><div class="progress-fill" style="width:'+a.avancement+'%"></div></div>';
    html += '<span style="font-size:13px;font-weight:700;color:var(--steel-dk);min-width:32px;text-align:right">'+a.avancement+'%</span>';
    html += '</div></div>';
    html += '<div class="action-body" id="ab-'+a.id+'">';
    html += commentHtml + efficaceHtml;
    html += '<div style="display:flex;gap:8px;flex-wrap:wrap">';
    html += '<button class="btn btn-blue btn-sm" onclick="editAction(''+a.id+'')">✏️ Modifier</button>';
    html += '<button class="btn btn-danger btn-sm" onclick="deleteAction(''+a.id+'')">🗑️ Supprimer</button>';
    html += '</div></div></div>';
  });
  el.innerHTML = html;
}

function togAction(el){
  var id=el.dataset.id;
  var b=document.getElementById('ab-'+id);
  if(b)b.classList.toggle('open');
}

function updateOriginField(){
  var sel=document.getElementById('m-origin-sel').value;
  var inp=document.getElementById('m-origin');
  var isProjet=sel.includes('Projet');
  document.getElementById('m-projet-fields').style.display=isProjet?'grid':'none';
  document.getElementById('m-livrable-fld').style.display=isProjet?'block':'none';
  // Pre-fill precision field hint based on selection
  if(sel.includes('Revue processus')){
    inp.placeholder='Ex: Processus DIRECTION, Processus VENTE...';
  } else if(sel.includes('GMAO')){
    inp.placeholder='Ex: Pont elevateur — Site 38';
  } else if(sel.includes('Indicateur')){
    inp.placeholder='Ex: KPI Taux satisfaction — Processus VEN';
  } else if(sel.includes('Audit de conformite')||sel.includes('Audit de conformité')){
    inp.placeholder='Ex: Section incendie — Site 41';
  } else {
    inp.placeholder='Preciser si necessaire...';
  }
}

var editingId=null;
function openNewModal(auditId,site,auditDate,sectionKey,criteriaIdx,origin){
  editingId=null;
  document.getElementById('modal-title').textContent='Nouvelle action';
  document.getElementById('m-id').value='';
  document.getElementById('m-audit-id').value=auditId||'';
  document.getElementById('m-site').value=site||'';
  document.getElementById('m-section-key').value=sectionKey||'';
  document.getElementById('m-criteria-idx').value=criteriaIdx!=null?criteriaIdx:'';
  document.getElementById('m-origin-sel').value='';
  document.getElementById('m-origin').value=origin||'';
  document.getElementById('m-projet-fields').style.display='none';
  document.getElementById('m-livrable-fld').style.display='none';
  document.getElementById('m-description').value='';
  document.getElementById('m-responsable').value='';
  document.getElementById('m-delai').value='';
  document.getElementById('m-avancement').value=0;
  document.getElementById('m-avancement-val').textContent='0%';
  document.getElementById('m-commentaire').value='';
  document.querySelectorAll('input[name="efficace"]').forEach(function(r){r.checked=r.value==='';});
  document.getElementById('m-efficace-row').style.display='none';
  document.getElementById('modal').style.display='flex';
}

function editAction(id){
  var a=ACTIONS.find(function(x){return String(x.id)===String(id);});
  if(!a)return;
  editingId=id;
  document.getElementById('modal-title').textContent='Modifier l action';
  document.getElementById('m-id').value=a.id;
  document.getElementById('m-audit-id').value=a.auditId;
  document.getElementById('m-site').value=a.site;
  document.getElementById('m-section-key').value=a.sectionKey;
  document.getElementById('m-criteria-idx').value=a.criteriaIdx;
  document.getElementById('m-origin-sel').value='';
  document.getElementById('m-origin').value=a.origin||'';
  var isP=(a.origin||'').includes('Projet')||(String(a.auditId||'')).startsWith('PROJ-');
  document.getElementById('m-projet-fields').style.display=isP?'grid':'none';
  document.getElementById('m-livrable-fld').style.display=isP?'block':'none';
  document.getElementById('m-date-debut').value=a.dateDebut||'';
  document.getElementById('m-phase').value=a.phase||'';
  document.getElementById('m-livrable').value=a.livrable||'';
  document.getElementById('m-description').value=a.description||'';
  document.getElementById('m-responsable').value=a.responsable||'';
  document.getElementById('m-delai').value=a.delai||'';
  document.getElementById('m-avancement').value=a.avancement||0;
  document.getElementById('m-avancement-val').textContent=(a.avancement||0)+'%';
  document.getElementById('m-commentaire').value=a.commentaire||'';
  var av=Number(a.avancement||0);
  document.getElementById('m-efficace-row').style.display=av>=100?'flex':'none';
  document.querySelectorAll('input[name="efficace"]').forEach(function(r){r.checked=r.value===(a.efficace||'');});
  document.getElementById('modal').style.display='flex';
}

function updateAvancement(v){
  document.getElementById('m-avancement-val').textContent=v+'%';
  document.getElementById('m-efficace-row').style.display=Number(v)>=100?'flex':'none';
  if(Number(v)<100){
    document.querySelectorAll('input[name="efficace"]').forEach(function(r){r.checked=r.value==='';});
  }
}

function closeModal(){document.getElementById('modal').style.display='none';}
function closeModalOutside(e){if(e.target===document.getElementById('modal'))closeModal();}

async function saveAction(){
  var desc=document.getElementById('m-description').value.trim();
  var resp=document.getElementById('m-responsable').value.trim();
  var delai=document.getElementById('m-delai').value;
  if(!desc||!resp||!delai){showToast('Description, responsable et delai obligatoires',false);return;}
  var efficaceEl=document.querySelector('input[name="efficace"]:checked');
  // Build full origin: type + precision
  var originSel=document.getElementById('m-origin-sel').value;
  var originPrec=document.getElementById('m-origin').value.trim();
  var fullOrigin=originSel?(originSel+(originPrec?' — '+originPrec:'')):originPrec;
  var action={
    id:document.getElementById('m-id').value||Date.now(),
    auditId:document.getElementById('m-audit-id').value,
    site:document.getElementById('m-site').value,
    auditDate:'',
    sectionKey:document.getElementById('m-section-key').value,
    criteriaIdx:document.getElementById('m-criteria-idx').value,
    origin:fullOrigin,
    description:desc,
    responsable:resp,
    delai:delai,
    avancement:Number(document.getElementById('m-avancement').value),
    commentaire:document.getElementById('m-commentaire').value.trim(),
    efficace:efficaceEl?efficaceEl.value:'',
    createdAt:new Date().toISOString()
  };
  showToast('Enregistrement...',false);
  try{
    await apiSaveAction(action);
    if(action.efficace==='oui'){
      await apiUpdateAuditNC(action.auditId,action.sectionKey,Number(action.criteriaIdx));
    }
    var idx=ACTIONS.findIndex(function(a){return String(a.id)===String(action.id);});
    if(idx>=0)ACTIONS[idx]=action;else ACTIONS.push(action);
    closeModal();
    render();
    showToast('Action enregistree !',true);
  }catch(e){
    showToast('Erreur: '+e.message,false);
  }
}

async function deleteAction(id){
  if(!confirm('Supprimer cette action ?'))return;
  try{
    await apiDeleteAction(id);
    ACTIONS=ACTIONS.filter(function(a){return String(a.id)!==String(id);});
    render();
    showToast('Action supprimee',true);
  }catch(e){showToast('Erreur: '+e.message,false);}
}

function showToast(msg,ok){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.style.background=ok?'var(--green-dk)':'var(--steel-dk)';
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},3000);
}

init().then(function(){
  var p=new URLSearchParams(window.location.search);
  if(p.get('auditId')){
    var sk=p.get('sectionKey'),ci=Number(p.get('criteriaIdx'));
    var originFromUrl=p.get('origin')?decodeURIComponent(p.get('origin')):'';
    openNewModal(p.get('auditId'),p.get('site'),'',sk,ci,originFromUrl);
  }
});
