function log(msg, cls) {
  const el = document.getElementById('log');
  const div = document.createElement('div');
  div.className = cls||'info'; div.textContent = msg;
  el.appendChild(div); el.scrollTop = el.scrollHeight;
}

async function send(data, action) {
  const r = await fetch(GSHEET_URL, {method:'POST', body:JSON.stringify({action, data})});
  return r.ok;
}

async function startSync() {
  const btn = document.getElementById('btn-risks');
  btn.disabled = true; btn.textContent = '⏳ En cours...';
  log('Démarrage — ' + RISKS.length + ' risques à envoyer', 'info');
  let ok=0, err=0;
  for (let i=0; i<RISKS.length; i++) {
    document.getElementById('progress').textContent = i+1+'/'+RISKS.length+' — '+RISKS[i].unite+' — '+RISKS[i].situation.substring(0,40);
    try {
      const success = await send(RISKS[i], 'saveDUERP');
      if (success) { ok++; if(i%10===0) log('✓ '+ok+' envoyés...','ok'); }
      else { err++; log('✗ Erreur: '+RISKS[i].situation.substring(0,40),'err'); }
    } catch(e) { err++; log('✗ Exception: '+e.message,'err'); }
    await new Promise(r=>setTimeout(r,200));
  }
  document.getElementById('progress').textContent = '✅ '+ok+' risques envoyés, '+err+' erreurs';
  log('=== Risques terminés: '+ok+' OK, '+err+' erreurs ===', ok===RISKS.length?'ok':'warn');
  btn.textContent = ok===RISKS.length?'✅ Risques OK':'⚠️ '+ok+'/'+RISKS.length;
  btn.style.background = ok===RISKS.length?'#4D8A12':'#D97706';
  document.getElementById('btn-cmr').disabled = false;
}

    } catch(e) { log('✗ '+e.message,'err'); }

  log('=== Synchronisation terminée ! ===','ok');
}
